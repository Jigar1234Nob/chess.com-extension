<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess.com Embedder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup-page">
  <main class="popup-card">
    <div class="brand-mark" aria-hidden="true">♞</div>
    <p class="eyebrow">CHESS.COM EMBEDDER</p>
    <h1>Your next move.</h1>
    <p class="muted">Jump straight into Chess.com in a full browser tab.</p>
    <button id="openChess" class="primary-button">Open Chess.com <span aria-hidden="true">↗</span></button>
    <button id="openDashboard" class="secondary-button">Open dashboard</button>
    <p class="fine-print">No account data is collected or stored by this extension.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
